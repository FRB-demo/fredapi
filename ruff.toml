target-version = "py39"
line-length = 120

[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # line too long (let formatter handle it)
    "B905",  # zip without strict
    "SIM108", # ternary operator
]

[lint.per-file-ignores]
"fredapi/tests/*" = ["E501", "E402"]

[format]
quote-style = "single"
