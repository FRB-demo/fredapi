[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-research-assistant"
version = "0.1.0"
description = "AI Research Assistant - RAG-powered financial document Q&A"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: Unit tests (fast, no external dependencies)",
    "component: Component tests (may use local resources like ChromaDB)",
    "integration: Integration tests (test multiple components together)",
    "e2e: End-to-end tests (full pipeline)",
    "smoke: Smoke tests (quick health checks)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
